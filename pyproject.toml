[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelforge"
version = "0.1.0"
description = "Image ops for scripts and agents: filters, color and crops from the terminal, JSON in and out."
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia",
]

authors = [{name = "Alfredo Ramos"}]

requires-python = ">=3.10"
dependencies = [
    "Pillow>=10",
    "numpy>=1.26",
]

[project.optional-dependencies]
bg = ["rembg", "onnxruntime"]

[project.urls]
Homepage = "https://github.com/Alfredo-ctrl/pixelforge"
Repository = "https://github.com/Alfredo-ctrl/pixelforge"

[project.scripts]
pixelforge = "pixelforge.cli:main"

[tool.setuptools.packages.find]
include = ["pixelforge*"]

[dependency-groups]
dev = ["pytest>=8"]
